[project]
name = "fleet-sql"
version = "0.1.0"
description = "Text-to-SQL deep agent over fleet, configuration and deferral data, with large results offloaded to the filesystem."
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langchain>=1.0.0",
    "langchain-openai>=0.2",
    "langgraph>=0.6.0",
    "langsmith>=0.12",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src/agent", "."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
